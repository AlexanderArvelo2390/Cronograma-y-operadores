<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cronograma y operadores</title>
<style>
:root{--bg:#14161c;--panel:#1d2029;--line:#2c3040;--tx:#eceff6;--mut:#99a1b6;--acc:#ffb347;--bad:#ff6b6b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f5f8;--panel:#fff;--line:#d9dce6;--tx:#171a22;--mut:#586078;--acc:#b86a00;--bad:#c93030;color-scheme:light}}
:root[data-theme="dark"]{--bg:#14161c;--panel:#1d2029;--line:#2c3040;--tx:#eceff6;--mut:#99a1b6;--acc:#ffb347;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 14px}
h2{font-size:1rem;margin:0 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
label{display:block;font-size:.8rem;color:var(--mut);margin-bottom:4px}
input,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:inherit}
textarea{min-height:70px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{background:transparent;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:inherit;cursor:pointer}
button.pri{border-color:var(--acc);color:var(--acc)}
button.dash{border-style:dashed;border-color:var(--acc);color:var(--acc)}
button.del{color:var(--bad);border-color:var(--bad)}
.r{display:grid;grid-template-columns:120px 70px minmax(0,1fr) minmax(0,1.5fr) auto;gap:6px;margin-bottom:6px;align-items:center}
.o{display:flex;gap:6px;margin-bottom:6px;align-items:center;flex-wrap:wrap}
.o input[type=text]{flex:1 1 130px;width:auto}
.o label.ck{display:flex;align-items:center;gap:4px;margin:0;color:var(--tx);font-size:.85rem;white-space:nowrap}
.o input[type=checkbox]{width:auto}
@media(max-width:760px){.r{grid-template-columns:1fr 1fr}.r .w{grid-column:1/3}}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);border-radius:14px;padding:2px 4px 2px 10px;font-size:.85rem;display:flex;gap:4px;align-items:center}
.chip button{border:0;padding:0 6px;color:var(--bad)}
.mut{color:var(--mut);font-size:.85rem}
.scroll{overflow-x:auto}
.sheet{background:#fff;color:#111;padding:16px;min-width:620px;font-family:Calibri,Arial,sans-serif;font-size:var(--fs,16px)}
.sheet h3{margin:0 0 .6em;font-size:calc(var(--fs,16px)*1.5);text-align:center;overflow-wrap:anywhere}
.xl{width:100%;border-collapse:collapse}
.xl th,.xl td{border:1px solid #9a9a9a;padding:.4em .6em;text-align:center;font-size:var(--fs,16px);line-height:1.3;overflow-wrap:anywhere;vertical-align:middle}
.xl.cr{table-layout:fixed}
.xl th{font-weight:700;background:#fff}
.xl td.b{font-weight:700}
.xl tr.g td{background:#d9d9d9}
.pill{display:inline-block;padding:1px 10px;border-radius:10px;font-weight:700}
</style>
</head>
<body>
<main>
<h1>Cronograma y operadores</h1>
<div class="tabs" id="pgb" style="flex-wrap:wrap;align-items:center"></div>
<input type="file" id="pf" accept="application/pdf,.pdf" hidden>
<div class="tabs"><button id="tc" type="button">Cronograma</button><button id="to" type="button">Operadores</button></div>
<div class="grid">
<section id="ed"></section>
<section>
<div class="bar" style="align-items:center"><label for="fs" style="display:inline;margin:0">Tamaño de letra <b id="fsv"></b></label><input id="fs" type="range" min="12" max="30" step="1" style="width:150px;padding:0"><button class="pri" id="img" type="button" hidden>Guardar imagen</button><button class="pri" id="pdf" type="button" hidden>Guardar PDF</button><span id="nodl" class="mut" hidden>Para descargar la imagen o el PDF, abrí esta página desde claude.ai.</span></div>
<div class="scroll"><div class="sheet" id="rep"></div></div>
</section>
</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
var S={tab:"c",tc:"Cronograma",to:"Operadores",days:["26 de Octubre"],ops:[],rows:[
{f:"26 de Octubre",h:"7:00",t:"Hotel Alvear Icon",r:"Pablo + Javier + Alex + Mauro + Nico + Feli + Sebas + Markos"},
{f:"",h:"",t:"Armado de sonido",r:"Sebas + Nico + Javier"},
{f:"",h:"",t:"Armado de tramos + luces",r:"Pablo + Javier + Alex + Mauro + Feli"},
{f:"",h:"",t:"Armado de camaras",r:"Markos"},
{f:"",h:"",t:"Acometida al tablero",r:"Feli + Alex"},
{f:"",h:"10:00",t:"Hotel Alvear Icon",r:"Nico M + Gaston"},
{f:"",h:"13:00",t:"Almuerzo",r:"Todos"},
{f:"",h:"18:00",t:"Pruebas",r:"Diego + Gaston + Markos + Nico M"}]};
try{var sv=localStorage.getItem("co-state");if(sv){var p=JSON.parse(sv);if(p&&(p.rows||p.pages))S=p}}catch(e){}
var P;
function normalize(){
  if(!S.pages){S.pages=[{id:1,name:"Página 1",tc:S.tc||"Cronograma",to:S.to||"Operadores",days:S.days||[],ops:S.ops||[],rows:S.rows||[]}];S.cur=0;delete S.tc;delete S.to;delete S.days;delete S.ops;delete S.rows}
  if(S.cur==null||S.cur>=S.pages.length)S.cur=0;
  P=S.pages[S.cur];
}
normalize();
var DL=null;
var DB=null,pt=null,K="co-state";
function save(){
  S.ts=Date.now();
  try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
  if(DB){clearTimeout(pt);pt=setTimeout(function(){DB.set({ts:S.ts,json:JSON.stringify(S)}).catch(function(){})},700)}
}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function arm(b,txt,fn){var o=b.textContent,t;b.onclick=function(){if(b.dataset.a){clearTimeout(t);b.dataset.a="";b.textContent=o;fn();return}b.dataset.a="1";b.textContent=txt;t=setTimeout(function(){b.dataset.a="";b.textContent=o},3000)}}
function eff(){var c="";return P.rows.map(function(r){if(r.f)c=r.f;return c})}
function names(s){return String(s).split(/\s*[+,]\s*/).map(function(x){return x.trim()}).filter(function(x){return x&&!/^todos?$/i.test(x)})}
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function repC(){
  var e=eff(),h='<h3>'+esc(P.tc)+'</h3><table class="xl cr"><colgroup><col style="width:15%"><col style="width:9%"><col style="width:28%"><col style="width:48%"></colgroup><thead><tr><th>Fecha</th><th>Hora</th><th>Tareas</th><th>Responsable</th></tr></thead><tbody>';
  P.rows.forEach(function(r,i){
    h+='<tr class="'+(i%2?"":"g")+'">';
    if(i===0||e[i]!==e[i-1]){var n=1;while(i+n<e.length&&e[i+n]===e[i])n++;h+='<td rowspan="'+n+'" style="background:#fff;vertical-align:middle">'+esc(e[i])+'</td>'}
    h+='<td>'+esc(r.h)+'</td><td class="b">'+esc(r.t)+'</td><td class="b">'+esc(r.r)+'</td></tr>';
  });
  $("rep").innerHTML=h+'</tbody></table>';
}
function repO(){
  var h='<h3>'+esc(P.to)+'</h3><table class="xl"><thead><tr><th>Operador</th><th>Rol</th>';
  P.days.forEach(function(d){h+='<th>'+esc(d)+'</th>'});
  h+='</tr></thead><tbody>';
  P.ops.forEach(function(o,i){
    var rl=o.r?'<span class="pill" style="background:hsl('+hue(o.r.toLowerCase())+',70%,86%);color:hsl('+hue(o.r.toLowerCase())+',60%,25%)">'+esc(o.r)+'</span>':"";
    h+='<tr class="'+(i%2?"":"g")+'"><td class="b">'+esc(o.n)+'</td><td>'+rl+'</td>';
    P.days.forEach(function(d){h+='<td class="b">'+(o.d&&o.d[d]?"✔":"")+'</td>'});
    h+='</tr>';
  });
  $("rep").innerHTML=h+'</tbody></table>';
}
function rep(){$("rep").style.setProperty("--fs",(S.fs||16)+"px");S.tab==="c"?repC():repO()}
function edC(){
  var E=$("ed");
  E.innerHTML='<label for="ttl">Título</label><input id="ttl" style="margin-bottom:12px"><h2>Filas</h2><div class="mut" style="margin-bottom:6px">Fecha: escribila solo en la primera fila del día, las siguientes la heredan.</div><div id="rw"></div><div class="bar"><button class="dash" id="ar" type="button">Agregar fila</button><button class="del" id="cl" type="button">Borrar todo</button></div><label for="pa">Pegar desde Excel (Fecha, Hora, Tareas, Responsable)</label><textarea id="pa" placeholder="Copiá las celdas en Excel y pegalas acá"></textarea><div class="bar"><button class="pri" id="ip" type="button">Agregar filas pegadas</button></div>';
  $("ttl").value=P.tc;$("ttl").oninput=function(){P.tc=$("ttl").value;save();rep()};
  P.rows.forEach(function(r,i){
    var d=document.createElement("div");d.className="r";
    d.innerHTML='<input aria-label="Fecha" placeholder="Fecha" value="'+esc(r.f)+'"><input aria-label="Hora" placeholder="Hora" value="'+esc(r.h)+'"><input aria-label="Tarea" placeholder="Tarea" value="'+esc(r.t)+'"><input class="w" aria-label="Responsable" placeholder="Responsables (A + B + C)" value="'+esc(r.r)+'"><span style="display:flex;gap:4px"><button type="button" aria-label="Subir">↑</button><button type="button" aria-label="Bajar">↓</button><button class="del" type="button" aria-label="Quitar fila">×</button></span>';
    var f=d.querySelectorAll("input"),k=["f","h","t","r"];
    f.forEach(function(x,j){x.oninput=function(){r[k[j]]=x.value;save();rep()}});
    var b=d.querySelectorAll("button");
    b[0].onclick=function(){if(i>0){P.rows.splice(i-1,0,P.rows.splice(i,1)[0]);save();edC();rep()}};
    b[1].onclick=function(){if(i<P.rows.length-1){P.rows.splice(i+1,0,P.rows.splice(i,1)[0]);save();edC();rep()}};
    b[2].onclick=function(){P.rows.splice(i,1);save();edC();rep()};
    $("rw").appendChild(d);
  });
  $("ar").onclick=function(){P.rows.push({f:"",h:"",t:"",r:""});save();edC();rep()};
  arm($("cl"),"¿Seguro? Tocá de nuevo",function(){P.rows=[];save();edC();rep()});
  $("ip").onclick=function(){
    $("pa").value.split(/\r?\n/).forEach(function(l){
      var c=l.split("\t").map(function(x){return x.trim()});
      if(c.length<3||/^fecha$/i.test(c[0]))return;
      if(c.length>=4)P.rows.push({f:c[0],h:c[1],t:c[2],r:c[3]});else P.rows.push({f:"",h:c[0],t:c[1],r:c[2]});
    });
    save();edC();rep();
  };
}
function edO(){
  var E=$("ed");
  E.innerHTML='<label for="ttl">Título</label><input id="ttl" style="margin-bottom:12px"><h2>Días de trabajo</h2><div class="chips" id="ch"></div><div class="o"><input type="text" id="nd" placeholder="Ej: 27 de Octubre"><button id="ad" type="button">Agregar día</button></div><div class="bar"><button class="pri" id="im" type="button">Importar del cronograma</button></div><div class="mut" style="margin-bottom:10px">Trae los nombres, los días y marca en qué día trabaja cada uno según el cronograma.</div><h2>Operadores</h2><div id="ol"></div><div class="bar"><button class="dash" id="ao" type="button">Agregar operador</button><button class="del" id="co" type="button">Borrar operadores</button></div><datalist id="rl"><option>Sonido</option><option>Iluminación</option><option>Video</option><option>Cámaras</option><option>Rigging</option><option>Tablero eléctrico</option><option>Producción</option><option>Asistente</option></datalist>';
  $("ttl").value=P.to;$("ttl").oninput=function(){P.to=$("ttl").value;save();rep()};
  P.days.forEach(function(d,i){
    var c=document.createElement("span");c.className="chip";c.innerHTML=esc(d)+'<button type="button" aria-label="Quitar día">×</button>';
    c.querySelector("button").onclick=function(){P.days.splice(i,1);save();edO();rep()};
    $("ch").appendChild(c);
  });
  $("ad").onclick=function(){var v=$("nd").value.trim();if(v&&P.days.indexOf(v)<0){P.days.push(v);save();edO();rep()}};
  P.ops.forEach(function(o,i){
    var d=document.createElement("div");d.className="o";
    d.innerHTML='<input type="text" aria-label="Nombre" placeholder="Nombre" value="'+esc(o.n)+'"><input type="text" list="rl" aria-label="Rol" placeholder="Rol" value="'+esc(o.r)+'">';
    var f=d.querySelectorAll("input");
    f[0].oninput=function(){o.n=f[0].value;save();rep()};
    f[1].oninput=function(){o.r=f[1].value;save();rep()};
    P.days.forEach(function(day){
      var l=document.createElement("label");l.className="ck";
      l.innerHTML='<input type="checkbox"'+(o.d&&o.d[day]?" checked":"")+'>'+esc(day);
      l.firstChild.onchange=function(){o.d=o.d||{};o.d[day]=l.firstChild.checked;save();rep()};
      d.appendChild(l);
    });
    var nx=document.createElement("input");nx.type="text";nx.placeholder="Otro día (ej: 28 de Octubre)";nx.setAttribute("aria-label","Otro día");
    var na=document.createElement("button");na.type="button";na.textContent="+ Día";
    var addD=function(){var v=nx.value.trim();if(!v)return;if(P.days.indexOf(v)<0)P.days.push(v);o.d=o.d||{};o.d[v]=true;save();edO();rep()};
    na.onclick=addD;nx.onkeydown=function(ev){if(ev.key==="Enter")addD()};
    d.appendChild(nx);d.appendChild(na);
    var x=document.createElement("button");x.className="del";x.type="button";x.textContent="×";x.setAttribute("aria-label","Quitar operador");
    x.onclick=function(){P.ops.splice(i,1);save();edO();rep()};d.appendChild(x);
    $("ol").appendChild(d);
  });
  $("ao").onclick=function(){P.ops.push({n:"",r:"",d:{}});save();edO();rep()};
  arm($("co"),"¿Seguro? Tocá de nuevo",function(){P.ops=[];save();edO();rep()});
  $("im").onclick=function(){
    var e=eff();
    e.forEach(function(d){if(d&&P.days.indexOf(d)<0)P.days.push(d)});
    P.rows.forEach(function(r,i){names(r.r).forEach(function(n){
      var o=P.ops.filter(function(x){return x.n.toLowerCase()===n.toLowerCase()})[0];
      if(!o){o={n:n,r:"",d:{}};P.ops.push(o)}
      o.d=o.d||{};if(e[i])o.d[e[i]]=true;
    })});
    save();edO();rep();
  };
}
function draw(){
  $("tc").className=S.tab==="c"?"on":"";$("to").className=S.tab==="o"?"on":"";
  S.tab==="c"?edC():edO();rep();
}
$("fs").value=S.fs||16;$("fsv").textContent=(S.fs||16)+" px";
$("fs").oninput=function(){S.fs=+$("fs").value;$("fsv").textContent=S.fs+" px";save();rep()};
$("tc").onclick=function(){S.tab="c";save();draw()};
$("to").onclick=function(){S.tab="o";save();draw()};
var BR=[];
function snap(){
  BR=[];
  return html2canvas($("rep"),{backgroundColor:"#ffffff",scale:3,windowWidth:900,onclone:function(d){
    var r=d.getElementById("rep");
    r.style.cssText+=";position:absolute;left:0;top:0;margin:0;min-width:0;width:900px";
    var t0=r.getBoundingClientRect().top;
    Array.prototype.forEach.call(r.querySelectorAll("tbody tr"),function(e){BR.push(e.getBoundingClientRect().top-t0)});
  }});
}
function fname(x){return ((S.tab==="c"?P.tc:P.to).replace(/[^\w\-áéíóúñÁÉÍÓÚÑ ]+/g,"").trim().replace(/\s+/g,"-")||"documento")+"."+x}
function done(e){if(e&&e.code!=="declined")alert("No se pudo guardar el archivo.")}
$("img").onclick=function(){
  snap().then(function(c){c.toBlob(function(b){DL.save({filename:fname("png"),data:b}).catch(done)})}).catch(done);
};
$("pdf").onclick=function(){
  snap().then(function(c){
    var J=window.jspdf.jsPDF,d=new J({unit:"pt",format:"a4"});
    d.setProperties({title:fname("pdf").replace(/\.pdf$/,""),subject:"Cronograma y operadores",keywords:"CO1:"+enc(P)});
    var pw=595.28,ph=841.89,m=32,iw=pw-2*m,sc=iw/c.width,sh=Math.floor((ph-2*m)/sc);
    var br=BR.map(function(v){return Math.round(v*3)}).sort(function(a,b){return a-b});
    var y=0,pg=0;
    while(y<c.height){
      var end=Math.min(c.height,y+sh);
      if(end<c.height){var bk=br.filter(function(v){return v>y+sh*0.3&&v<=end}).pop();if(bk)end=bk}
      var hh=end-y,t=document.createElement("canvas");
      t.width=c.width;t.height=hh;
      var x=t.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,t.width,hh);x.drawImage(c,0,y,c.width,hh,0,0,c.width,hh);
      if(pg)d.addPage();
      d.addImage(t.toDataURL("image/png"),"PNG",m,m,iw,hh*sc);
      y=end;pg++;
    }
    return DL.save({filename:fname("pdf"),data:d.output("blob")});
  }).catch(done);
};
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function dec(x){return JSON.parse(decodeURIComponent(escape(atob(x))))}
function blank(n){return{id:Date.now(),name:n,tc:"Cronograma",to:"Operadores",days:[],ops:[],rows:[{f:"",h:"",t:"",r:""}]}}
function goPage(i){S.cur=i;P=S.pages[i];save();pages();draw()}
function addPage(pg){S.pages.push(pg);S.tab="c";goPage(S.pages.length-1)}
function pages(){
  var h="";
  S.pages.forEach(function(pg,i){h+='<button type="button" data-i="'+i+'" class="'+(i===S.cur?"on":"")+'">'+esc(pg.name||"Página")+'</button>'});
  h+='<button type="button" class="dash" id="np">+ Página</button><button type="button" id="dp">Duplicar</button><button type="button" id="ip">Importar PDF</button><button type="button" class="del" id="xp">Eliminar página</button><input type="text" id="pn" aria-label="Nombre de la página" placeholder="Nombre de la página" style="width:200px;flex:none">';
  $("pgb").innerHTML=h;
  var bs=$("pgb").querySelectorAll("button[data-i]");
  Array.prototype.forEach.call(bs,function(b){b.onclick=function(){goPage(+b.getAttribute("data-i"))}});
  $("pn").value=P.name||"";
  $("pn").oninput=function(){P.name=$("pn").value;save();bs[S.cur].textContent=P.name||"Página"};
  $("np").onclick=function(){addPage(blank("Página "+(S.pages.length+1)))};
  $("dp").onclick=function(){var c=JSON.parse(JSON.stringify(P));c.id=Date.now();c.name=(P.name||"Página")+" (copia)";addPage(c)};
  $("ip").onclick=function(){$("pf").click()};
  arm($("xp"),"¿Seguro? Tocá de nuevo",function(){
    if(S.pages.length>1)S.pages.splice(S.cur,1);else S.pages=[blank("Página 1")];
    S.cur=Math.max(0,Math.min(S.cur,S.pages.length-1));P=S.pages[S.cur];save();pages();draw();
  });
}
function autoOps(pg){
  var c="",e=pg.rows.map(function(r){if(r.f)c=r.f;return c});
  e.forEach(function(d){if(d&&pg.days.indexOf(d)<0)pg.days.push(d)});
  pg.rows.forEach(function(r,i){names(r.r).forEach(function(n){
    var o=pg.ops.filter(function(x){return x.n.toLowerCase()===n.toLowerCase()})[0];
    if(!o){o={n:n,r:"",d:{}};pg.ops.push(o)}
    o.d=o.d||{};if(e[i])o.d[e[i]]=true;
  })});
}
function pdfLines(items){
  var its=items.filter(function(i){return i.str&&i.str.trim()!==""}).map(function(i){return{x:i.transform[4],y:i.transform[5],w:i.width,s:i.str}});
  its.sort(function(a,b){return b.y-a.y||a.x-b.x});
  var lines=[];
  its.forEach(function(it){var L=lines[lines.length-1];if(L&&Math.abs(L.y-it.y)<3)L.items.push(it);else lines.push({y:it.y,items:[it]})});
  lines.forEach(function(L){
    L.items.sort(function(a,b){return a.x-b.x});L.cells=[];
    L.items.forEach(function(it){
      var c=L.cells[L.cells.length-1];
      if(c&&it.x-(c.x+c.w)<7){c.s+=(it.x-(c.x+c.w)>1?" ":"")+it.s;c.w=it.x+it.w-c.x}else L.cells.push({x:it.x,w:it.w,s:it.s});
    });
    L.cells.forEach(function(c){c.s=c.s.replace(/\s+/g," ").trim();c.cx=c.x+c.w/2});
  });
  return lines;
}
function parseLines(lines){
  var hi=-1,i;
  for(i=0;i<lines.length;i++){var t=lines[i].cells.map(function(c){return c.s.toLowerCase()}).join(" ");if(t.indexOf("hora")>=0&&(t.indexOf("tarea")>=0||t.indexOf("responsable")>=0)){hi=i;break}}
  var cols=[];
  if(hi>=0)lines[hi].cells.forEach(function(c){var s=c.s.toLowerCase(),k=s.indexOf("fecha")===0?"f":s.indexOf("hora")===0?"h":s.indexOf("tarea")===0?"t":s.indexOf("resp")===0?"r":null;if(k)cols.push({k:k,cx:c.cx})});
  var rows=[],fechas=[];
  lines.slice(hi+1).forEach(function(L){
    var o={f:"",h:"",t:"",r:""};
    if(cols.length>=3){
      L.cells.forEach(function(c){var b=cols[0];cols.forEach(function(q){if(Math.abs(q.cx-c.cx)<Math.abs(b.cx-c.cx))b=q});o[b.k]=(o[b.k]?o[b.k]+" ":"")+c.s});
    }else{
      var cs=L.cells.map(function(c){return c.s});
      if(cs.length>=4){o.f=cs[0];o.h=cs[1];o.t=cs[2];o.r=cs.slice(3).join(" ")}
      else if(cs.length===3){o.h=cs[0];o.t=cs[1];o.r=cs[2]}else return;
    }
    var fl=["f","h","t","r"].filter(function(k){return o[k]});
    if(!fl.length)return;
    if(!o.h&&!o.t&&o.r&&rows.length){if(o.f)fechas.push({s:o.f,i:rows.length});rows[rows.length-1].r+=" "+o.r;return}
    if(fl.length===1&&fl[0]==="f"){fechas.push({s:o.f,i:rows.length});return}
    if(fl.length===1&&rows.length&&(fl[0]==="t"||fl[0]==="r")){var pr=rows[rows.length-1];if(pr[fl[0]]){pr[fl[0]]+=" "+o[fl[0]];return}}
    rows.push(o);
  });
  fechas.forEach(function(F,j){
    var st=j===0?0:Math.round((fechas[j-1].i+F.i)/2);
    if(rows[st]&&!rows[st].f)rows[st].f=F.s;
  });
  return rows;
}
function readPdf(file){
  return file.arrayBuffer().then(function(buf){return pdfjsLib.getDocument({data:buf}).promise}).then(function(doc){
    return doc.getMetadata().then(function(md){
      var kw=md&&md.info&&md.info.Keywords;
      if(kw&&kw.indexOf("CO1:")===0){var pg=dec(kw.slice(4));pg.id=Date.now();return{pg:pg}}
      var all=[],chain=Promise.resolve();
      for(var i=1;i<=doc.numPages;i++)(function(n){chain=chain.then(function(){return doc.getPage(n).then(function(p){return p.getTextContent()}).then(function(tc){all=all.concat(pdfLines(tc.items))})})})(i);
      return chain.then(function(){return{rows:parseLines(all)}});
    });
  });
}
$("pf").onchange=function(){
  var f=this.files[0];this.value="";
  if(!f)return;
  if(!window.pdfjsLib){alert("No se pudo cargar el lector de PDF.");return}
  readPdf(f).then(function(r){
    var nm=f.name.replace(/\.pdf$/i,"");
    if(r.pg){r.pg.name=r.pg.name||nm;addPage(r.pg);return}
    if(!r.rows.length){alert("No encontré una tabla con texto en el PDF. Si es una imagen o un escaneo no se puede leer; probá pegando desde Excel.");return}
    var pg={id:Date.now(),name:nm,tc:nm,to:"Operadores",days:[],ops:[],rows:r.rows};
    autoOps(pg);addPage(pg);
  }).catch(function(){alert("No se pudo leer el PDF.")});
};
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
function applyAll(){normalize();$("fs").value=S.fs||16;$("fsv").textContent=(S.fs||16)+" px";pages();draw()}
function initDB(){
  claude.use("user").then(function(u){return u?u.id():null}).then(function(id){
    if(!id)return;
    return claude.use("db").then(function(d){
      if(!d)return;
      var ref=d.doc("data/users/"+id+"/"+K);
      return ref.get().then(function(sn){
        DB=ref;
        if(sn.exists){var x=sn.data();if(x&&x.ts>(S.ts||0)){try{var n=JSON.parse(x.json);if(n&&(n.rows||n.pages)){S=n;applyAll()}}catch(e){}}else if(x&&x.ts<(S.ts||0))save()}
        else save();
      });
    });
  }).catch(function(){});
}
applyAll();
if(window.claude&&claude.use){initDB();claude.use("downloads").then(function(d){if(d){DL=d;$("img").hidden=false;$("pdf").hidden=false}else $("nodl").hidden=false}).catch(function(){$("nodl").hidden=false})}else $("nodl").hidden=false;
</script>
